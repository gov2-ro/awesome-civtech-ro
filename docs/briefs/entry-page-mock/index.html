<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Machetă: pagina unei intrări — CivTech România</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 1600px; }
  /* Mock-up only: the layout of a full entry page. Colours and type come from style.css. */
  .mock-bar { background: #fff7d6; color: #5c4a00; border-bottom: 1px solid #e8d78a; font: 500 13px/1.4 var(--font-mono); padding: 8px 0; }
  .mock-bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .mock-bar select { font: inherit; padding: 2px 6px; }
  .mock-bar a { color: inherit; }
  @media (prefers-color-scheme: dark) { .mock-bar { background: #3a3200; color: #ffe98a; border-color: #5c4a00; } }

  @media (max-width: 899px) { #tabs { display: none; } }
  .hdr-in { max-width: none; }
  .p-crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 20px 0 8px; font: 500 calc(12px * var(--fs))/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .p-crumbs a { color: inherit; text-decoration: none; } .p-crumbs a:hover { color: var(--ink); text-decoration: underline; }
  .p-crumbs .sep { opacity: .5; }

  /* The entry lies on the list like a sheet: the list stays on the tinted backdrop at the left, and long names run under the sheet. */
  .p-layout { display: grid; }
  .p-sheet { min-width: 0; }
  @media (min-width: 900px) {
    .p-layout { grid-template-columns: 260px minmax(0, 1fr); max-width: none; padding: 0; background: var(--surface); }
    .p-sheet { position: relative; z-index: 2; background: var(--bg); padding: 0 32px; min-height: calc(100vh - 72px);
      border-left: 1px solid var(--line); border-top-left-radius: 2px; box-shadow: -10px 0 30px rgb(0 0 0 / .07); }
  }
  @media (min-width: 900px) and (prefers-color-scheme: dark) { .p-sheet { box-shadow: -10px 0 30px rgb(0 0 0 / .45); } }
  .p-toc { min-width: 0; --toc-bg: var(--bg); }
  @media (min-width: 900px) { .p-toc:not(.open) { --toc-bg: var(--surface); } .p-toc .toc-it .blank { background: var(--surface-2); } }
  @media (min-width: 900px) {
    .p-toc { position: sticky; top: 72px; z-index: 1; align-self: start; width: 480px; max-height: calc(100vh - 72px); overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none; padding: 16px 0 40px 20px; }
    .p-toc::-webkit-scrollbar { display: none; }
    .toc-it span { white-space: nowrap; }
  }
  @media (max-width: 899px) { .p-toc { display: none; } .p-toc.open { display: block; position: fixed; inset: 0; z-index: 40; overflow: auto; background: var(--bg); padding: 16px; } }
  .toc-top { position: sticky; top: -16px; z-index: 2; background: var(--toc-bg); width: 228px; padding: 4px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 6px; }
  .toc-top b { font: 650 calc(15px * var(--fs))/1.3 var(--font-head); }
  .toc-top a, .toc-close { font: 500 calc(12px * var(--fs))/1.4 var(--font-mono); color: var(--muted); }
  .toc-filter { font-size: calc(12px * var(--fs)); color: var(--muted); margin: 0 0 8px; }
  .toc-close { display: none; background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 8px; cursor: pointer; }
  .p-toc.open .toc-close { display: inline-block; }
  .toc-h { position: sticky; top: 14px; z-index: 1; background: var(--toc-bg); margin: 14px 0 2px; padding: 4px 8px; font: 500 calc(11px * var(--fs))/1.4 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .toc-it { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; font-size: calc(14px * var(--fs)); line-height: 1.3; color: var(--ink-2); text-decoration: none; }
  .toc-it:hover { background: var(--surface-2); color: var(--ink); }
  @media (max-width: 899px) { .toc-it:hover { background: var(--surface); } .toc-top { width: auto; } }
  .toc-it[aria-current] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--ink); }
  .toc-it img, .toc-it .blank { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; background: var(--surface); flex: none; }
  .toc-it.off { opacity: .55; }
  .toc-btn { display: none; margin: 16px 0 0; font: 500 calc(13px * var(--fs))/1 var(--font-mono); background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; color: var(--ink); cursor: pointer; }
  @media (max-width: 899px) { .toc-btn { display: inline-block; } }
  .p-hero { display: grid; gap: 24px; align-items: start; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  @media (min-width: 1200px) { .p-hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; } }
  .p-title { display: flex; gap: 16px; align-items: flex-start; }
  .p-title img { width: 56px; height: 56px; border-radius: 10px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 4px; flex: none; }
  .p-title h1 { font: 650 clamp(28px, 4vw, 44px)/1.08 var(--font-head); letter-spacing: -.02em; margin: 0; }
  .p-tag { font-size: calc(19px * var(--fs)); line-height: 1.4; margin: 14px 0 0; color: var(--ink); }
  .p-hero .p-desc { margin-top: 14px; color: var(--ink-2); }
  .p-cta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 18px 0 0; }
  .p-url { font-size: calc(17px * var(--fs)); font-weight: 600; color: var(--ink); margin-right: 6px; }
  .p-cta .d-badges { display: contents; }
  .p-facts a.net { display: inline-flex; padding: 3px; color: var(--ink-2); border-radius: var(--radius); }
  .p-facts a.net:hover { color: var(--accent-ink); }
  .p-facts a.net svg { width: 18px; height: 18px; fill: currentColor; stroke: none; display: block; }
  .p-links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .p-shot { border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; background: var(--surface); aspect-ratio: 1200 / 630; }
  .p-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .p-body { display: grid; gap: 32px; padding: 28px 0 40px; grid-template-areas: "facts" "main"; }
  @media (min-width: 1200px) { .p-body { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "main facts"; gap: 40px; } .p-facts { position: sticky; top: 88px; align-self: start; } }
  .p-main { grid-area: main; min-width: 0; } .p-facts { grid-area: facts; min-width: 0; }
  .p-sec { margin: 0 0 32px; }
  .p-sec h2 { font: 600 calc(13px * var(--fs))/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .p-desc { font-size: calc(17px * var(--fs)); line-height: 1.6; margin: 0; max-width: 68ch; }
  .p-note { font-size: calc(13px * var(--fs)); color: var(--muted); margin: 8px 0 0; }

  .p-facts .box { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; background: var(--bg); }
  .p-facts dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: calc(14px * var(--fs)); }
  .p-facts dt { color: var(--muted); font: 500 calc(12px * var(--fs))/1.6 var(--font-mono); }
  .p-facts dd { margin: 0; overflow-wrap: anywhere; }
  .p-facts .report { display: block; margin-top: 12px; font-size: calc(13px * var(--fs)); color: var(--muted); }

  .p-class { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 16px; margin: 0; }
  .p-class dt { color: var(--muted); font: 500 calc(12px * var(--fs))/2 var(--font-mono); }
  .p-class dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .p-chip { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 14px; font-size: calc(14px * var(--fs)); color: var(--ink); text-decoration: none; background: var(--bg); }
  .p-chip:hover { border-color: var(--ink); }
  .p-chip.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  @media (max-width: 560px) { .p-class, .p-facts dl { grid-template-columns: 1fr; gap: 2px; } .p-class dd, .p-facts dd { margin-bottom: 10px; } }

  .p-data { display: grid; gap: 12px; }
  .p-data .big { font: 600 calc(22px * var(--fs))/1.2 var(--font-head); }
  .p-data .ex { display: flex; flex-wrap: wrap; gap: 6px; }
  .p-data code { font: 400 calc(12px * var(--fs))/1 var(--font-mono); padding: 5px 7px; border-radius: 4px; background: var(--surface); }

  .p-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .p-card { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: inherit; }
  .p-card:hover { border-color: var(--ink); }
  .p-card img, .p-card .blank { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; background: var(--surface); grid-row: span 2; }
  .p-card b { font: 600 calc(15px * var(--fs))/1.3 var(--font-head); }
  .p-card span { font-size: calc(13px * var(--fs)); color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .p-nav { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0 48px; border-top: 1px solid var(--line); font-size: calc(14px * var(--fs)); }
  .p-nav a { color: var(--ink); text-decoration: none; max-width: 45%; } .p-nav a:hover { text-decoration: underline; }
  .p-nav small { display: block; color: var(--muted); font: 500 calc(11px * var(--fs))/1.6 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>

};
const SAMPLES = ['de-unde-vine-apa', 'marius-comper', 'sicap-ai', 'funky-citizens', 'hack-for-facts', 'orase-vii', 'monitorul-ai'];
const FACET = [['subjects', 'subj', 'Subiecte'], ['topics', 'topic', 'Teme'], ['purposes', 'purpose', 'Scop civic'], ['capabilities', 'cap', 'Ce poți face'],
  ['formats', 'fmt', 'Format'], ['technologies', 'tech', 'Tehnologie'], ['institutions', 'inst', 'Instituții vizate'], ['organisationTypes', 'orgt', 'Tip de organizație']];
// The list the visitor came from: the filters of the list page ride along in the query (only `subj` and `q` in this mock).
const QS = new URLSearchParams(location.search); QS.delete('slug');
const keep = QS.toString() ? '&' + QS : '';
function codeLink(url) {
  const m = url.match(/^https?:\/\/(?:www\.)?(github|gitlab)\.com\/(.+?)\/?$/i);
  const text = m ? m[2] : url.replace(/^https?:\/\/(www\.)?/, '');
  const logo = m ? `<svg class="forge" viewBox="0 0 24 24" aria-hidden="true"><path d="${NETWORK[m[1].toLowerCase()]}"/></svg>` : '';
  return `<a class="code-link" href="${esc(url)}" target="_blank" rel="noopener">${logo}${esc(text)}</a>`;
}
const STATUS = { activ: 'Activ', offline: 'Offline', arhivat: 'Arhivat', neverificat: 'Neverificat', necunoscut: 'Necunoscut', parcat: 'Domeniu parcat', mutat: 'Mutat', blocat: 'Blocat' };

fetch(ROOT + 'data.json').then(r => r.json()).then(DB => {
  const V = DB.vocabulary, BY = new Map(DB.items.map(i => [i.slug, i]));
  const label = id => V.concepts.find(c => c.id === id)?.label || V.areas.find(a => a.id === id)?.label || id;
  const kindLabel = k => V.kinds.find(x => x.key === k)?.label || k;
  const list = (k, extra = '') => `${ROOT}?k=${k}${extra}`;
  const pick = document.getElementById('pick');
  const slug = new URLSearchParams(location.search).get('slug') || SAMPLES[0];
  pick.innerHTML = [...new Set([...SAMPLES.filter(s => BY.has(s)), slug])].map(s => `<option ${s === slug ? 'selected' : ''}>${esc(s)}</option>`).join('')
    + '<option value="">— altă intrare: ?slug=… în adresă</option>';
  pick.onchange = () => { if (pick.value) location.search = '?slug=' + pick.value; };
  const it = BY.get(slug);
  if (!it) { document.getElementById('page').innerHTML = `<p>Nu există intrarea „${esc(slug)}”.</p>`; return; }
  document.getElementById('cur').href = `${ROOT}${it.kind}/${it.slug}/`;
  document.title = `${it.name} — CivTech România`;
  document.getElementById('tabs').innerHTML = V.kinds.map(k => `<a class="tab" href="${list(k.key)}" ${k.key === it.kind ? 'aria-current="page"' : ''}>${esc(k.label)}</a>`).join('');

  const alive = !['offline', 'arhivat'].includes(it.status);
  const subj = it.primarySubject;
  const parent = it.attributions.find(a => a.role === 'parte_din' && BY.has(a.org));
  const authors = it.attributions.filter(a => a.role !== 'parte_din');
  const children = DB.items.filter(i => i.attributions.some(a => a.role === 'parte_din' && a.org === it.slug));
  const sameAuthor = it.kind === 'organizatie'
    ? DB.items.filter(i => i.kind !== 'organizatie' && !children.includes(i) && i.attributions.some(a => a.role !== 'parte_din' && a.org === it.slug))
    : !authors.length ? [] : DB.items.filter(i => i !== it && !children.includes(i) && i.attributions.some(a => a.role !== 'parte_din' && authors.some(b => (a.org && a.org === b.org) || a.name === b.name)));
  const related = !subj ? [] : DB.items.filter(i => i.kind === it.kind && i.slug !== it.slug && i.subjects.includes(subj) && !children.includes(i) && !sameAuthor.includes(i))
    .sort((a, b) => (b.primarySubject === subj) - (a.primarySubject === subj) || b.score - a.score).slice(0, 6);
  // The sidebar: the list of the section, with the list page's filters, grouped as the list page groups it
  // (projects by primary subject, the other sections A–Z), inactive entries last in each group.
  const byName = (a, b) => a.name.localeCompare(b.name, 'ro');
  const fSubj = QS.get('subj'), fQ = (QS.get('q') || '').toLowerCase();
  const inList = DB.items.filter(i => i.kind === it.kind && (!fSubj || i.subjects.includes(fSubj)) && (!fQ || (i.name + ' ' + (i.tagline || '') + ' ' + (i.desc || '')).toLowerCase().includes(fQ)));
  if (!inList.includes(it)) inList.push(it);
  const off = i => ['offline', 'arhivat'].includes(i.status);
  const groups = new Map();
  if (it.kind === 'proiect') {
    const order = V.concepts.map(c => c.id);
    for (const i of [...inList].sort((a, b) => order.indexOf(a.primarySubject) - order.indexOf(b.primarySubject))) {
      const g = i.primarySubject || '';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(i);
    }
  } else groups.set('', inList);
  for (const g of groups.values()) g.sort((a, b) => off(a) - off(b) || byName(a, b));
  const sameKind = [...groups.values()].flat();
  const at = sameKind.indexOf(it), prev = sameKind[at - 1], next = sameKind[at + 1];
  const tocItem = i => `<a class="toc-it${off(i) ? ' off' : ''}" href="?slug=${esc(i.slug)}${keep}" ${i === it ? 'aria-current="page"' : ''}>${i.icon ? `<img src="${ROOT}${esc(i.icon)}" alt="" loading="lazy">` : '<i class="blank"></i>'}<span>${esc(i.name)}</span></a>`;
  const toc = document.getElementById('toc');
  toc.innerHTML = `<div class="toc-top"><a href="${list(it.kind, fSubj ? '&subj=' + encodeURIComponent(fSubj) : '')}" title="Înapoi la lista cu filtre">← filtre</a><button class="toc-close" type="button">Închide</button></div>
    ${fSubj || fQ ? `<p class="toc-filter">Filtrat: ${[fSubj && esc(label(fSubj)), fQ && `„${esc(fQ)}”`].filter(Boolean).join(' · ')} · <a href="?slug=${esc(it.slug)}">toată secțiunea</a></p>` : ''}
    ${[...groups].map(([g, xs]) => `${g ? `<p class="toc-h">${esc(label(g))} · ${xs.length}</p>` : ''}${xs.map(tocItem).join('')}`).join('')}`;
  toc.querySelector('.toc-close').onclick = () => toc.classList.remove('open');

  const card = i => `<a class="p-card" href="?slug=${esc(i.slug)}${keep}">${i.icon ? `<img src="${ROOT}${esc(i.icon)}" alt="">` : '<i class="blank"></i>'}<b>${esc(i.name)}</b><span>${esc(i.tagline || i.desc)}</span></a>`;
  const host = u => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  const facts = [
    authors.length && ['Autor', authors.map(a => a.org && BY.has(a.org) ? `<a href="?slug=${esc(a.org)}">${esc(BY.get(a.org).name)}</a>` : esc(a.name)).join(', ')],
    parent && ['Parte din', `<a href="?slug=${esc(parent.org)}">${esc(BY.get(parent.org).name)}</a>`],
    it.url && ['Site', `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.domain)}</a>`],
    it.links.length && ['Linkuri', `<span class="p-links">${[...it.links].sort((a, b) => !NETWORK[a.role] - !NETWORK[b.role]).map(l => NETWORK[l.role]
      ? `<a class="net" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.label)}" aria-label="${esc(l.label)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${NETWORK[l.role]}"/></svg></a>`
      : `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.role || host(l.url))}</a>`).join('')}</span>`],
    it.code && ['Cod sursă', codeLink(it.code)],
    it.repo?.license && ['Licență', esc(it.repo.license)],
    it.contact && ['Contact', esc(it.contact)],
    it.areas.length && ['Acoperire', it.areas.map(a => `<a href="${list(it.kind, '&area=' + encodeURIComponent(a))}">${esc(label(a))}</a>`).join(', ')],
    it.dataRelation && ['Date', esc(V.dataRelations.find(d => d.key === it.dataRelation)?.label || it.dataRelation)],
    it.dataSources.length && ['Surse de date', it.dataSources.map(s => `<a href="${list(it.kind, '&source=' + encodeURIComponent(s.name))}">${esc(s.name)}</a>`).join(', ')],
    it.since && ['Prima urmă', `${esc(it.since)} <span class="muted small">· nu e data lansării</span>`],
    it.updated && ['Actualizat', esc(it.updated)],
    ['Stare', `${esc(STATUS[it.status] || it.status)}${it.checked ? ` <span class="muted small">· verificat ${esc(it.checked)}</span>` : ''}`],
  ].filter(Boolean);
  const classRows = FACET.map(([field, key, title]) => (it[field] || []).length && `<dt>${title}</dt><dd>${it[field].map(id =>
    `<a class="p-chip${id === subj ? ' main' : ''}" href="${list(it.kind, `&${key}=${encodeURIComponent(id)}`)}">${esc(label(id))}</a>`).join('')}</dd>`).filter(Boolean).join('');
  const inv = it.inventory;
  const sheet = DB.site?.sheet && it.sheet ? `${DB.site.sheet}#gid=${DB.site.tabs?.[it.sheet.tab] || 0}&range=A${it.sheet.row}` : '';

  document.getElementById('page').innerHTML = `
    <button class="toc-btn" type="button" id="tocBtn">☰ ${esc(kindLabel(it.kind))} · ${inList.length}</button>
    <nav class="p-crumbs" aria-label="Unde ești"><a href="${list(it.kind)}">${esc(kindLabel(it.kind))}</a>${subj ? `<span class="sep">›</span><a href="${list(it.kind, '&subj=' + encodeURIComponent(subj))}">${esc(label(subj))}</a>` : ''}</nav>
    <section class="p-hero">
      <div>
        <div class="p-title">${it.icon ? `<img src="${ROOT}${esc(it.icon)}" alt="">` : ''}<h1>${esc(it.name)}</h1></div>
        ${it.tagline ? `<p class="p-tag">${esc(it.tagline)}</p>` : ''}
        ${it.desc ? `<p class="p-desc">${esc(it.desc)}</p>${it.descSrc === 'site' ? '<p class="p-note">Descriere preluată de pe site-ul proiectului.</p>' : ''}` : ''}
        <div class="p-cta">
          ${alive && it.url ? `<a class="p-url" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.domain)} ↗</a>` : ''}
          ${it.wayback ? `<a class="btn btn-outline" href="${esc(it.wayback)}" target="_blank" rel="noopener">Arhivă</a>` : ''}
          ${inv?.page ? `<a class="btn btn-outline" href="${ROOT}${esc(inv.page)}">Datele proiectului</a>` : ''}
        <div class="d-badges"><span>${esc(STATUS[it.status] || it.status)}</span><span>${esc(V.entityTypes.find(e => e.key === it.entityType)?.label || it.entityType)}</span>${it.code ? '<span>cod public</span>' : ''}${it.civictech ? '<span>civic tech</span>' : ''}</div>
        </div>
      </div>
      ${it.img ? `<div class="p-shot"><img src="${ROOT}${esc(it.img.src)}" alt="Imagine de pe ${esc(it.domain)}"></div>` : ''}
    </section>
    <div class="p-body">
      <div class="p-main">
        ${inv?.count ? `<section class="p-sec"><h2>Date &amp; metodă</h2><div class="p-data">
          <div><span class="big">${inv.count}</span> câmpuri și parametri · ${inv.sources} ${inv.sources === 1 ? 'sursă consultată' : 'surse consultate'}${inv.partial ? ' · inventar parțial' : ''}</div>
          <div class="ex">${(inv.examples || []).map(e => `<code>${esc(e)}</code>`).join('')}</div>
          ${(inv.docs || []).length ? `<div>Documentație: ${inv.docs.map(d => `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label)}</a>`).join(', ')}</div>` : ''}
          ${inv.page ? `<div><a href="${ROOT}${esc(inv.page)}">Toate câmpurile, în inventarul de date →</a></div>` : ''}
        </div></section>` : ''}
        ${classRows ? `<section class="p-sec"><h2>Clasificare</h2><dl class="p-class">${classRows}</dl><p class="p-note">Fiecare etichetă deschide lista cu aceeași etichetă.</p></section>` : ''}
        ${children.length ? `<section class="p-sec"><h2>Conține (${children.length})</h2><div class="p-cards">${children.map(card).join('')}</div></section>` : ''}
        ${sameAuthor.length ? `<section class="p-sec"><h2>${it.kind === 'organizatie' ? 'Proiecte și resurse' : 'Același autor'} (${sameAuthor.length})</h2><div class="p-cards">${sameAuthor.map(card).join('')}</div></section>` : ''}
        ${related.length ? `<section class="p-sec"><h2>Tot din ${esc(label(subj))}</h2><div class="p-cards">${related.map(card).join('')}</div></section>` : ''}
      </div>
      <aside class="p-facts"><div class="box"><dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>
        ${sheet ? `<a class="report" href="${esc(sheet)}" target="_blank" rel="noopener">Lipsește ceva sau e greșit? Corectează în Google Sheets ↗</a>` : ''}</aside>
    </div>
    <nav class="p-nav" aria-label="Intrarea anterioară și următoare">
      ${prev ? `<a href="?slug=${esc(prev.slug)}${keep}"><small>← anterioara din listă</small>${esc(prev.name)}</a>` : '<span></span>'}
      <a href="${list(it.kind)}" style="text-align:center"><small>înapoi la</small>${esc(kindLabel(it.kind))}</a>
      ${next ? `<a href="?slug=${esc(next.slug)}${keep}" style="text-align:right"><small>următoarea din listă →</small>${esc(next.name)}</a>` : '<span></span>'}
    </nav>`;
  const cur = toc.querySelector('[aria-current]');
  const centre = () => { if (cur) toc.scrollTop = cur.offsetTop - toc.clientHeight / 2; };
  document.getElementById('tocBtn').onclick = () => { toc.classList.add('open'); centre(); };
  centre();
});
</script>
