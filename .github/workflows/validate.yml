name: validate

# Checks every change to the data, the scripts, the site, the v2 browser code or the workflows.
# The public source is the taxonomy v2 integration copy: its publication gate, build, package checks and tests block.
on:
  pull_request:
    paths: ["data/**", "scripts/**", "site/**", "site-v2/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "site/**", "site-v2/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # integrare.py proves a detached overlay at its detach commit, and the rehearsal clones the history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the public data root with the publication gate
        run: python3 scripts/validate.py --publication
      - name: Build the public site
        run: python3 scripts/build.py
      - name: Unit tests (taxonomy v2, enrichment, Sheets and Form)
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check the v2 package and the integration copy
        run: |
          python3 data/taxonomy-v2/validate.py > /dev/null
          python3 data/taxonomy-v2/validate.py --root data/taxonomy-v2/integrare --baseline > /dev/null
          python3 data/taxonomy-v2/integrare.py
          python3 scripts/validate.py --data-dir data/taxonomy-v2/integrare
      - name: Build the v2 preview
        run: python3 scripts/build.py --data-dir data/taxonomy-v2/integrare --site-dir "$RUNNER_TEMP/site-v2" --allow-draft
      - uses: actions/upload-artifact@v7
        with:
          name: site-v2-preview
          path: ${{ runner.temp }}/site-v2
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: JavaScript syntax
        run: |
          node --check site/app.js
      - name: Build and serve the v2 preview
        run: |
          python3 scripts/build.py --data-dir data/taxonomy-v2/integrare --site-dir "$RUNNER_TEMP/site-v2" --allow-draft --with-inventory
          python3 -m http.server -d "$RUNNER_TEMP/site-v2" 8765 > /dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://localhost:8765/data.json > /dev/null && break; sleep 0.5; done
      - name: Browser checks (desktop and mobile)
        run: |
          uv run --with playwright playwright install --with-deps chromium
          uv run scripts/check_preview.py http://localhost:8765/
          uv run scripts/check_inventory_preview.py http://localhost:8765/
          uv run scripts/check_data_finder.py http://localhost:8765/

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflow files
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
