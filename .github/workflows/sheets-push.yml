name: sheets-push

# Repo -> Google Sheet. After a push to main that changes proiecte.csv or orgs.csv, rewrites both tabs.
# `sheets.py push` refuses (exit 3) when the Sheet holds edits that are not in the repo yet. Its base is the commit named
# in the Sheet's `_sync` tab (the last successful push), not the `before` of this run: a skipped run does not move it.
# It writes that marker last. The manual inputs `since` and `force` replace the marker for one run.
# Needs: secret GOOGLE_SA_KEY (the service-account key, JSON) and variable SHEET_ID.
on:
  push:
    branches: [main]
    paths: ["data/proiecte.csv", "data/orgs.csv"]
  workflow_dispatch:
    inputs:
      since:
        description: "Commit to use as the base instead of the Sheet's sync marker (empty: use the marker)"
        required: false
        default: ""
      force:
        description: "Overwrite the Sheet without the check"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sheets
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sync marker (and `--since`) names an earlier commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Write the CSVs to the Sheet
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          SINCE: ${{ inputs.since }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          set +e
          uv run scripts/sheets.py push "${args[@]}"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::error::Tabelul are modificări nesincronizate; rulează sheets-pull"
          fi
          exit "$code"
