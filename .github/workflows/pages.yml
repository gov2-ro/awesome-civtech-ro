name: pages

# Publishes site/ to GitHub Pages. Needs Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.py dates the feed items by the commit that added each entry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and build site data
        run: |
          python3 scripts/validate.py --data-dir data/taxonomy-v2/integrare --publication
          python3 scripts/build.py --data-dir data/taxonomy-v2/integrare --with-inventory --with-structure
      # IndexNow: compare the pages with the manifest of the live site (the previous deploy), before this deploy replaces it.
      - name: Plan the IndexNow submission
        run: python3 scripts/indexnow.py plan --site-dir site --out "$RUNNER_TEMP/indexnow-urls.txt"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      # After the deploy, so that the engines find the new pages and the key file. A failure warns and never fails the run.
      - name: Tell search engines about new and changed pages (IndexNow)
        continue-on-error: true
        run: python3 scripts/indexnow.py submit --site-dir site --urls "$RUNNER_TEMP/indexnow-urls.txt"
